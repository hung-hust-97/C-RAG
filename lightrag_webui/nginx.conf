server {
    listen 80;
    server_name _;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache immutable static assets
    location /webui/assets/ {
        alias /usr/share/nginx/html/webui/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve static UI files
    location /webui/ {
        alias /usr/share/nginx/html/webui/;
        try_files $uri $uri/ /webui/index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://lightrag:9621/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
    }

    # Proxy documentation endpoints
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://lightrag:9621$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy static assets served by FastAPI
    location /static/ {
        proxy_pass http://lightrag:9621/static/;
    }

    # Fallback proxy for direct API endpoints (e.g. /pipeline, /system, /documents)
    location / {
        proxy_pass http://lightrag:9621;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
